<style>
    @import url('CDN/google-fonts.css');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f1f5f9; margin: 0; }
    .file-row:hover { background: #f8fafc; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    .image-nav-btn:hover { background: rgba(25,118,210,0.85) !important; box-shadow: 0 4px 20px rgba(25,118,210,0.4) !important; }
    #pub-back-to-top { opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s; }
    #pub-back-to-top.show { opacity:1;visibility:visible; }
    #pub-back-to-top:hover { transform:translateY(-2px);box-shadow:0 6px 24px rgba(18,150,219,0.35); }
    /* 文档预览 */
    #pub-doc-preview-container { max-height:70vh; overflow-y:auto; padding:24px 32px; background:#fff; font-size:14px; line-height:1.8; color:#333; font-family:'Segoe UI','Microsoft YaHei',sans-serif; }
    #pub-doc-preview-container table { border-collapse:collapse; width:100%; margin:8px 0; }
    #pub-doc-preview-container td, #pub-doc-preview-container th { border:1px solid #d1d5db; padding:4px 8px; vertical-align:top; }
    #pub-doc-preview-container img { max-width:100%; height:auto; }
    #pub-doc-preview-container h1 { font-size:1.8em; margin:0.6em 0 0.3em; font-weight:700; color:#1e293b; }
    #pub-doc-preview-container h2 { font-size:1.5em; margin:0.5em 0 0.25em; font-weight:600; color:#334155; }
    #pub-doc-preview-container h3 { font-size:1.25em; margin:0.4em 0 0.2em; font-weight:600; color:#475569; }
    #pub-doc-preview-container h4 { font-size:1.1em; margin:0.3em 0 0.15em; font-weight:600; }
    #pub-doc-preview-container p { margin:0.5em 0; }
    #pub-doc-preview-container ul, #pub-doc-preview-container ol { padding-left:1.8em; margin:0.4em 0; }
    #pub-doc-preview-container li { margin:0.15em 0; }
    #pub-doc-preview-container blockquote { border-left:3px solid #e2e8f0; padding-left:12px; margin:0.5em 0; color:#64748b; }
    #pub-doc-preview-container pre { background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:12px; overflow-x:auto; font-size:13px; line-height:1.5; }
    #pub-doc-preview-container code { background:#f1f5f9; padding:1px 4px; border-radius:3px; font-size:0.9em; }
    #pub-doc-preview-container pre code { background:none; padding:0; }
    #pub-doc-preview-container hr { border:none; border-top:1px solid #e2e8f0; margin:12px 0; }
    #pub-doc-preview-container a { color:#2563eb; text-decoration:underline; }
    #pub-doc-preview-container strong, #pub-doc-preview-container b { font-weight:700; }
    #pub-doc-preview-container em, #pub-doc-preview-container i { font-style:italic; }
    #pub-doc-preview-excel-wrap { max-height:70vh; overflow:auto; background:#fff; }
    #pub-doc-preview-excel-wrap table { border-collapse:collapse; font-size:12px; width:max-content; min-width:100%; }
    #pub-doc-preview-excel-wrap td, #pub-doc-preview-excel-wrap th { border:1px solid #cbd5e1; padding:4px 10px; white-space:nowrap; min-width:60px; }
    #pub-doc-preview-excel-wrap th { background:#f1f5f9; font-weight:600; position:sticky; top:0; z-index:1; color:#334155; }
    #pub-doc-preview-excel-wrap tr:nth-child(even) td { background:#f8fafc; }
    #pub-doc-preview-excel-wrap tr:hover td { background:#e0f2fe; }
    .excel-sheet-tab { padding:5px 14px; border:1px solid #cbd5e1; border-bottom:none; border-radius:6px 6px 0 0; background:#f1f5f9; color:#64748b; font-size:12px; cursor:pointer; transition:all 0.15s; }
    .excel-sheet-tab:hover { background:#e2e8f0; color:#334155; }
    .excel-sheet-tab.active { background:#fff; color:#1e40af; border-color:#3b82f6; font-weight:600; }
    #pub-doc-preview-text { max-height:70vh; overflow:auto; padding:16px 24px; background:#1e293b; color:#e2e8f0; font-family:'Fira Code',Consolas,monospace; font-size:13px; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="relative mb-8 fade-in">
        <a href="/" class="absolute top-0 right-0 inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition-colors">
            <svg class="iconify-icon text-base"><use href="#login"/></svg>
            登录
        </a>
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-2xl mb-4">
                <svg class="iconify-icon text-3xl text-blue-600"><use href="#folder_open_outline"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">公共共享</h1>
            <p class="text-sm text-slate-500 mt-1">无需登录，直接浏览下载共享文件</p>
        </div>
    </div>

    <!-- Upload area -->
    <div id="upload-area" class="mb-4 fade-in">
        <div class="flex items-center gap-2 flex-wrap">
            <label for="file-input" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:border-blue-500 hover:text-blue-600 text-slate-700 rounded-lg text-sm font-medium cursor-pointer transition-all shadow-sm">
                <svg class="iconify-icon text-base"><use href="#cloud_upload_outline"/></svg>
                选择文件
            </label>
            <input type="file" id="file-input" multiple class="hidden" onchange="onFilesSelected(this, false)"/>
            <label for="folder-input" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:border-indigo-500 hover:text-indigo-600 text-slate-700 rounded-lg text-sm font-medium cursor-pointer transition-all shadow-sm">
                <svg class="iconify-icon text-base"><use href="#folder_upload_outline"/></svg>
                选择目录
            </label>
            <input type="file" id="folder-input" webkitdirectory class="hidden" onchange="onFilesSelected(this, true)"/>
            <button id="pub-btn-upload" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition-colors shadow-sm flex items-center gap-2 hidden" onclick="startPublicUpload()">
                <svg class="iconify-icon text-base"><use href="#upload"/></svg>
                开始上传
            </button>
            <button id="pub-btn-stop" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-bold transition-colors shadow-sm flex items-center gap-1 hidden" onclick="stopPublicUpload()">
                <svg class="iconify-icon text-base"><use href="#stop"/></svg>
                停止
            </button>
            <div id="upload-status-wrap" class="flex items-center gap-1 hidden">
            <span id="upload-status" class="text-xs text-slate-400"></span>
            <button id="pub-upload-clear-btn" class="text-slate-400 hover:text-red-500 transition-colors" title="清除已选文件">
                <svg class="iconify-icon text-base"><use href="#close"/></svg>
            </button>
        </div>
        </div>
        <div id="upload-progress" class="mt-2 hidden">
            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                <div id="upload-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width:0%"></div>
            </div>
            <div class="text-xs text-slate-400 mt-1" id="upload-speed"></div>
        </div>
    </div>

    <!-- Download progress -->
    <div id="download-panel" class="mb-4 hidden fade-in">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-slate-700 truncate max-w-[60%]" id="pub-dl-file">--</span>
                <span class="text-sm text-slate-500" id="pub-dl-percent">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-green-500 h-full rounded-full transition-all duration-300" id="pub-dl-bar" style="width:0%"></div>
            </div>
            <div class="flex items-center justify-between mt-2">
                <span class="text-xs text-slate-400" id="pub-dl-size">0 / ...</span>
                <div class="flex items-center gap-2">
                    <button class="text-xs text-blue-600 hover:text-blue-800 underline" id="pub-btn-dl-resume" onclick="pubResumeDownload()" style="display:none">继续</button>
                    <button class="text-xs text-red-500 hover:text-red-700 underline" id="pub-btn-dl-cancel" onclick="pubCancelDownload()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm mb-4 fade-in" id="breadcrumb">
        <a href="javascript:void(0)" onclick="navigateTo('')" class="text-blue-600 hover:text-blue-700 font-medium">根目录</a>
        <span id="breadcrumb-path" class="text-slate-400"></span>
    </div>

    <!-- Toolbar -->
    <div class="flex items-center justify-between mb-3">
        <div class="text-xs text-slate-400" id="item-count"></div>
        <div class="flex items-center gap-2">
            <button id="pub-btn-sort-category" class="transition-colors text-xs" onclick="pubSetSortCategory()">按类别排序</button>
            <span class="w-px h-3 bg-slate-300"></span>
            <button id="pub-btn-sort-name" class="transition-colors text-xs text-blue-600 font-medium" onclick="pubSetSortName()">按名称排序 ↑</button>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="flex items-center gap-3 mb-3" id="pub-search-bar">
        <div class="relative flex-1">
            <svg class="iconify-icon absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"><use href="#magnify"/></svg>
            <input type="text" id="pub-search-input" placeholder="搜索文件..." 
                   class="w-full pl-9 pr-9 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-400 focus:bg-white transition-colors"
                   oninput="pubOnSearchInput(this.value)" autocomplete="off">
            <button id="pub-search-clear-btn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 transition-colors" onclick="pubClearSearch()" title="清除搜索">
                <svg class="iconify-icon text-xs"><use href="#close"/></svg>
            </button>
        </div>
        <span id="pub-search-count" class="text-xs text-slate-400 whitespace-nowrap hidden"></span>
    </div>

    <!-- File list -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in">
        <div id="file-list" class="divide-y divide-slate-100">
            <div class="p-12 text-center text-slate-400">
                <svg class="iconify-icon text-2xl animate-spin mb-2 inline-block"><use href="#loading"/></svg>
                <p class="text-sm">加载中...</p>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16 fade-in">
        <svg class="iconify-icon text-5xl text-slate-300 mb-3 inline-block"><use href="#folder_open_outline"/></svg>
        <p class="text-slate-500 text-sm">此文件夹为空</p>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8 text-xs text-slate-400">
        Powered by LanFileShare
    </div>
</div>

<!-- Toast -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden" id="pub-toast" style="z-index:100001;">
    <div class="bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-2">
        <svg class="iconify-icon text-green-400 text-xl"><use href="#check_circle"/></svg>
        <span id="pub-toast-msg" class="text-sm">已成功复制到剪贴板</span>
    </div>
</div>

<!-- 图片查看器 -->
<div class="fixed inset-0 z-50 hidden flex items-center justify-center" id="pub-modal-image-viewer">
    <div class="absolute inset-0 bg-black/40" onclick="pubCloseImageViewer()"></div>
    <div class="relative bg-gray-900 rounded-2xl shadow-2xl overflow-hidden" id="pub-image-viewer-panel" data-panel="pub-image" data-tx="0" data-ty="0" style="max-width:85vw;max-height:88vh;">
        <div class="flex items-center justify-between px-4 py-2.5 select-none panel-drag-handle cursor-move" id="pub-image-viewer-header">
            <span id="pub-image-viewer-title" class="text-white/80 text-sm font-medium truncate max-w-[30%]"></span>
            <div class="flex items-center gap-1">
                <button onclick="pubRotateImage(-90)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="逆时针旋转90°"><svg class="iconify-icon text-xl"><use href="#rotate_left"/></svg></button>
                <button onclick="pubRotateImage(90)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="顺时针旋转90°"><svg class="iconify-icon text-xl"><use href="#rotate_right"/></svg></button>
                <button onclick="pubZoomImage(-0.25)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="缩小"><svg class="iconify-icon text-xl"><use href="#magnify_minus_outline"/></svg></button>
                <span id="pub-image-zoom-label" class="text-white/50 text-xs min-w-[40px] text-center">100%</span>
                <button onclick="pubZoomImage(0.25)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="放大"><svg class="iconify-icon text-xl"><use href="#magnify_plus_outline"/></svg></button>
                <button onclick="pubResetImageTransform()" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="重置"><svg class="iconify-icon text-xl"><use href="#image_refresh_outline"/></svg></button>
                <span class="w-px h-6 bg-white/20 mx-1"></span>
                <button onclick="pubNavigateMedia(-1)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="上一张"><svg class="iconify-icon text-xl"><use href="#chevron_left"/></svg></button>
                <button onclick="pubNavigateMedia(1)" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="下一张"><svg class="iconify-icon text-xl"><use href="#chevron_right"/></svg></button>
                <span class="w-px h-6 bg-white/20 mx-1"></span>
                <button onclick="pubDownloadCurrentMedia()" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="下载"><svg class="iconify-icon text-xl"><use href="#download"/></svg></button>
                <button onclick="pubCloseImageViewer()" class="p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-lg transition" title="关闭"><svg class="iconify-icon text-xl"><use href="#close"/></svg></button>
            </div>
        </div>
        <div class="flex items-center justify-center p-2 min-h-0 overflow-hidden" id="pub-image-viewer-container" style="max-height:calc(88vh - 44px); position:relative;">
            <img id="pub-image-viewer-img" class="rounded-lg select-none" src="" alt="" style="max-width:none;max-height:none;cursor:grab;transform-origin:center center;transition:transform 0.15s ease;" draggable="false" />
            <!-- 左右导航按钮 -->
            <button id="pub-image-prev-btn" onclick="pubNavigateMedia(-1)" class="image-nav-btn" style="position:absolute;top:50%;left:6px;transform:translateY(-50%);z-index:10001;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s,box-shadow 0.2s;box-shadow:0 2px 12px rgba(0,0,0,0.3);" title="上一张">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
            </button>
            <button id="pub-image-next-btn" onclick="pubNavigateMedia(1)" class="image-nav-btn" style="position:absolute;top:50%;right:6px;transform:translateY(-50%);z-index:10001;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s,box-shadow 0.2s;box-shadow:0 2px 12px rgba(0,0,0,0.3);" title="下一张">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </button>
        </div>
    </div>
</div>

<!-- 视频播放器 -->
<div class="fixed inset-0 z-50 hidden flex items-center justify-center" id="pub-modal-video-player">
    <div class="absolute inset-0 bg-black/40" onclick="pubCloseVideoPlayer()"></div>
    <div class="relative bg-black rounded-2xl shadow-2xl overflow-hidden max-w-[45vw]" id="pub-video-player-panel" data-panel="pub-video" data-tx="0" data-ty="0">
        <div class="flex items-center justify-between px-4 py-2.5 select-none panel-drag-handle cursor-move" id="pub-video-player-header">
            <span id="pub-video-player-title" class="text-white/80 text-sm font-medium truncate"></span>
            <div class="flex items-center gap-3">
                <button onclick="pubDownloadCurrentMedia()" class="p-1.5 text-white/60 hover:text-white hover:bg-white/10 rounded-lg transition" title="下载"><svg class="iconify-icon text-lg"><use href="#download"/></svg></button>
                <button onclick="pubCloseVideoPlayer()" class="p-1.5 text-white/60 hover:text-white hover:bg-white/10 rounded-lg transition" title="关闭"><svg class="iconify-icon text-lg"><use href="#close"/></svg></button>
            </div>
        </div>
        <div class="relative group" id="pub-video-container">
            <video id="pub-video-player-el" class="w-full block" autoplay playsinline style="max-height:38vh;"></video>

<script>
let _currentPath = '';
let _publicRootNames = new Map();

function logAction(action, detail) {
    fetch('/api/log/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, detail: detail || '' })
    }).catch(() => {});
}

function showToast(msg) {
    var toast = document.getElementById('pub-toast');
    if (!toast) return;
    document.getElementById('pub-toast-msg').innerText = msg;
    toast.classList.remove('hidden');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.add('hidden'); }, 2500);
}

function filesAction(action, files) {
    const arr = Array.from(files);
    const count = arr.length;
    const names = arr.map(f => "'" + f.name + "'").join('、');
    return action + '（' + count + ' 个）' + names;
}

// 媒体文件类型判断
function isImageFile(name) { return /\.(jpg|jpeg|png|gif|bmp|webp|svg|ico|tiff?)$/i.test(name); }
// 浏览器原生 <video> 标签可直接播放的格式
function isPlayableVideo(name) { return /\.(mp4|webm|ogv|ogg|mov)$/i.test(name); }
// 所有视频格式（包括浏览器不支持的，仅用于分类排序）
function isVideoFile(name) { return /\.(mp4|webm|ogv|ogg|mov|avi|mkv|flv|wmv|m4v|3gp|ts|rm|rmvb)$/i.test(name); }
// 不可在线播放的视频格式（需下载）
function isUnplayableVideo(name) { return isVideoFile(name) && !isPlayableVideo(name); }
// 浏览器可直接播放的音频格式
function isPlayableAudio(name) { return /\.(mp3|wav|ogg|flac|aac|m4a|opus|wma)$/i.test(name); }
// 可预览的媒体文件（图片 + 可播放视频 + 可播放音频）
function isMediaFile(name) { return isImageFile(name) || isPlayableVideo(name) || isPlayableAudio(name); }
// 可预览的文档文件（PDF/Word/Excel/文本）
function isDocFile(name) { return /\.(pdf|docx|xlsx|xls|txt|csv|md|json|xml|log|ini|cfg|yaml|yml|html?|css|js|ts|py|java|c|cpp|cs|go|rs|php|rb|sql|sh|bat|ps1)$/i.test(name); }
function isPdfFile(name) { return /\.pdf$/i.test(name); }
function isWordFile(name) { return /\.docx$/i.test(name); }
function isExcelFile(name) { return /\.xlsx?$/i.test(name); }
function isTextFile(name) { return /\.(txt|csv|md|json|xml|log|ini|cfg|yaml|yml|html?|css|js|ts|py|java|c|cpp|cs|go|rs|php|rb|sql|sh|bat|ps1)$/i.test(name); }



// 获取文件类别排序权重
function getCategoryOrder(file) {
    if (file.isDirectory) return 0;
    const name = file.name;
    if (isImageFile(name)) return 1;
    if (isVideoFile(name)) return 2;
    if (/\.(mp3|wav|flac|aac|ogg|wma|m4a|opus)$/i.test(name)) return 3;
    if (/\.(zip|rar|7z|tar|gz|bz2|xz|iso|cab)$/i.test(name)) return 4;
    if (/\.(doc|docx|xls|xlsx|ppt|pptx|pdf|txt|csv|md|json|xml|html|htm|css|js|ts|py|java|c|cpp|cs|go|rs|php|rb|sql|yaml|yml|ini|cfg|log)$/i.test(name)) return 5;
    return 6;
}

function getCategoryName(order) {
    const names = ['文件夹', '图片', '视频', '音频', '压缩包', '文档/代码', '其他'];
    return names[order] || '其他';
}

// 文件名截断：过长时隐藏中间部分，保留扩展名始终可见
function truncateFileName(name, maxLen) {
    if (name.length <= maxLen) return escHtml(name);
    const dotIndex = name.lastIndexOf('.');
    if (dotIndex <= 0) {
        return escHtml(name.substring(0, maxLen - 1)) + '…';
    }
    const ext = name.substring(dotIndex);
    const baseName = name.substring(0, dotIndex);
    const baseMax = maxLen - ext.length - 1;
    if (baseMax < 1) {
        return escHtml(name.substring(0, maxLen - 1)) + '…';
    }
    return escHtml(baseName.substring(0, baseMax)) + '…' + escHtml(ext);
}

// 分类折叠状态
let _collapsedCategories = new Set();

let _allFiles = [];
let _sortMode = 'name';
let _sortAsc = true;
let _pubMediaFiles = [];
let _pubMediaIndex = -1;
let _pubImageRotation = 0;
let _pubImageScale = 1;
let _pubImageTranslateX = 0;
let _pubImageTranslateY = 0;
let _pubIsDragging = false;
let _pubDragStartX = 0;
let _pubDragStartY = 0;
let _pubDragOrigTranslateX = 0;
let _pubDragOrigTranslateY = 0;
// 搜索状态
let _pubSearchQuery = '';
let _pubSearchTimer = null;
let _pubIsSearching = false;

async function pubOnSearchInput(val) {
    val = (val || '').trim();
    var clearBtn = document.getElementById('pub-search-clear-btn');
    clearBtn.classList.toggle('hidden', !val);
    clearTimeout(_pubSearchTimer);
    if (!val) {
        _pubSearchQuery = '';
        _pubIsSearching = false;
        document.getElementById('pub-search-count').classList.add('hidden');
        loadFiles(_currentPath);
        return;
    }
    _pubSearchTimer = setTimeout(function() { pubDoSearch(val); }, 350);
}

async function pubDoSearch(q) {
    _pubSearchQuery = q;
    _pubIsSearching = true;
    var countEl = document.getElementById('pub-search-count');
    if (!q) { pubClearSearch(); return; }
    try {
        var res = await fetch('/api/public/files/search?q=' + encodeURIComponent(q));
        var results = await res.json();
        var hasError = results && results.error;
        if (!Array.isArray(results)) results = [];
        countEl.textContent = hasError ? '' : '找到 ' + results.length + ' 个结果';
        countEl.classList.remove('hidden');
        pubRenderSearchResults(results, hasError);
    } catch (err) {
        countEl.classList.add('hidden');
        document.getElementById('file-list').innerHTML =
            '<div class="p-12 text-center text-slate-400"><p class="text-sm">搜索失败: ' + escHtml(err.message) + '</p></div>';
    }
}

function pubRenderSearchResults(results, hasError) {
    var list = document.getElementById('file-list');
    var empty = document.getElementById('empty-state');
    var count = document.getElementById('item-count');
    var breadcrumb = document.getElementById('breadcrumb');
    if (breadcrumb) breadcrumb.style.display = 'none';

    if (hasError) {
        list.innerHTML = '<div class="p-8 text-center text-slate-400"><p class="text-sm">' + escHtml(results.error || '搜索出错') + '</p></div>';
        list.classList.remove('hidden');
        empty.classList.add('hidden');
        count.textContent = '';
        return;
    }
    if (!results || results.length === 0) {
        list.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.innerHTML = '<svg class="iconify-icon text-3xl text-slate-300 mb-2 inline-block"><use href="#magnify"/></svg><p class="text-slate-400 text-sm">未找到匹配的文件</p>';
        count.textContent = '';
        return;
    }

    list.classList.remove('hidden');
    empty.classList.add('hidden');
    count.textContent = results.length + ' 个结果';

    var html = '';
    results.forEach(function(f) {
        var iconHtml = f.isDirectory
            ? '<svg class="iconify-icon flex-shrink-0 text-yellow-500 text-xl"><use href="#folder"/></svg>'
            : '<svg class="iconify-icon flex-shrink-0 ' + escHtml(f.iconColor || '') + '"><use href="#' + escHtml((f.icon || 'mdi:file').replace('mdi:', '').replace(/-/g, '_')) + '"/></svg>';
        var sizeStr = f.sizeDisplay || (f.size >= 0 ? formatFileSize(f.size) : '--');
        var locationHtml = f.parentPath ? '<span class="text-xs text-slate-400 ml-2">' + escHtml(publicDisplayPath(f.parentPath)) + '</span>' : '';

        html += '<div class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-50 last:border-0" onclick="' + 
            (f.isDirectory ? "pubClearSearch();navigateTo('" + escAttr(f.path) + "')" : "downloadPublicFile('" + escAttr(f.path) + "', '" + escAttr(f.name) + "')") + '">' +
            '<div class="flex items-center gap-3 flex-1 min-w-0">' + iconHtml +
            '<div class="flex flex-col min-w-0"><span class="text-sm text-slate-700 font-medium truncate">' + escHtml(f.name) + '</span>' +
            locationHtml + '</div></div>' +
            '<span class="text-xs text-slate-400 flex-shrink-0 hidden sm:block">' + escHtml(sizeStr) + '</span></div>';
    });
    list.innerHTML = html;
}

function pubClearSearch() {
    _pubSearchQuery = '';
    _pubIsSearching = false;
    document.getElementById('pub-search-input').value = '';
    document.getElementById('pub-search-clear-btn').classList.add('hidden');
    document.getElementById('pub-search-count').classList.add('hidden');
    var breadcrumb = document.getElementById('breadcrumb');
    if (breadcrumb) breadcrumb.style.display = '';
    loadFiles(_currentPath);
}

async function loadFiles(path) {
    _currentPath = path || '';
    try {
        const res = await fetch('/api/public/files?path=' + encodeURIComponent(_currentPath));
        if (!res.ok) {
            const errText = await res.text();
            throw new Error(errText || ('HTTP ' + res.status));
        }
        const data = await res.json();
        // 确保返回的是数组，防止非数组数据导致渲染卡死
        if (!Array.isArray(data)) {
            throw new Error(data.error || '服务器返回了异常数据');
        }
        _allFiles = data;
        if (!_currentPath) _publicRootNames = new Map(data.map(folder => [folder.path, folder.name]));
        renderFileList(data);
        renderBreadcrumb(_currentPath);
        updateUploadAreaVisibility();
    } catch (err) {
        document.getElementById('file-list').innerHTML =
            '<div class="p-12 text-center text-red-400"><p class="text-sm">加载失败: ' + escHtml(err.message || '请刷新重试') + '</p></div>';
    }
}

function updateUploadAreaVisibility() {
    var uploadArea = document.getElementById('upload-area');
    if (!uploadArea) return;
    // 根目录不允许上传，隐藏上传区域
    if (!_currentPath || _currentPath === '') {
        uploadArea.classList.add('hidden');
    } else {
        uploadArea.classList.remove('hidden');
    }
}

function publicDisplayPath(path) {
    const parts = path.split('/');
    parts[0] = _publicRootNames.get(parts[0]) || parts[0];
    return parts.join('/');
}

function renderBreadcrumb(path) {
    const el = document.getElementById('breadcrumb-path');
    const breadcrumb = document.getElementById('breadcrumb');
    if (!breadcrumb) return;

    if (!path) {
        // 根目录：隐藏面包屑，只显示"根目录"
        el.innerHTML = '';
        breadcrumb.querySelector('a').textContent = '根目录';
        return;
    }

    const parts = path.split('/').filter(Boolean);
    let html = '';
    let accumulated = '';
    parts.forEach((p, i) => {
        accumulated += '/' + p;
        const name = i === 0 ? _publicRootNames.get(p) || p : p;
        html += '<span class="text-slate-300 mx-1">/</span>';
        if (i < parts.length - 1) {
            html += '<a href="javascript:void(0)" onclick="navigateTo(\'' + escAttr(accumulated.substring(1)) + '\')" class="text-blue-600 hover:text-blue-700 font-medium">' + escHtml(name) + '</a>';
        } else {
            html += '<span class="text-slate-600 font-medium">' + escHtml(name) + '</span>';
        }
    });
    el.innerHTML = html;
    // 更新"根目录"链接导航
    breadcrumb.querySelector('a').onclick = function() { navigateTo(''); };
}

function renderFileList(files) {
    const list = document.getElementById('file-list');
    const empty = document.getElementById('empty-state');
    const count = document.getElementById('item-count');

    if (!files || files.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        count.textContent = '';
        list.classList.add('hidden');
        return;
    }

    list.classList.remove('hidden');
    empty.classList.add('hidden');
    count.textContent = files.length + ' 个项目';

    // 排序
    const sorted = [...files];
    sorted.sort((a, b) => {
        if (_sortMode === 'category') {
            const catA = getCategoryOrder(a);
            const catB = getCategoryOrder(b);
            if (catA !== catB) return catA - catB;
        } else {
            if (a.isDirectory !== b.isDirectory) return a.isDirectory ? -1 : 1;
        }
        const cmp = a.name.localeCompare(b.name, 'zh-Hans-CN', { sensitivity: 'base' });
        return _sortAsc ? cmp : -cmp;
    });

    let lastCategory = -1;
    let currentCatCollapsed = false;
    let html = '';
    sorted.forEach(f => {
        // 类别分组标题
        let catHeader = '';
        if (_sortMode === 'category') {
            const cat = getCategoryOrder(f);
            if (cat !== lastCategory) {
                lastCategory = cat;
                const isCollapsed = _collapsedCategories.has(cat);
                currentCatCollapsed = isCollapsed;
                const catIcons = ['📁', '🖼️', '🎬', '🎵', '📦', '📄', '📎'];
                const arrow = isCollapsed ? '▶' : '▼';
                catHeader = '<div class="file-row flex items-center gap-3 px-4 py-2 bg-slate-100/80 text-xs font-semibold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-200/80 transition-colors select-none" data-category-toggle="' + cat + '">' +
                    arrow + ' ' + (catIcons[cat] || '📎') + ' ' + getCategoryName(cat) + '</div>';
            }
        }
        const icon = f.isDirectory
            ? '<svg class="iconify-icon text-amber-500 text-xl shrink-0"><use href="#folder"/></svg>'
            : fileIcon(f.name);
        const relPath = f.path || '';
        const isMedia = !f.isDirectory && isMediaFile(f.name);
        const isDoc = !f.isDirectory && !isMedia && isDocFile(f.name);
        const isUnplayableVid = !f.isDirectory && isUnplayableVideo(f.name);
        const canPreview = isMedia || isDoc;
        const displayName = truncateFileName(f.name, 28);

            : (canPreview
                ? '<a href="javascript:void(0)" onclick="' + (isMedia ? 'pubOpenMediaPreview' : 'pubOpenDocPreview') + '(\'' + encodePath(relPath) + '\')" class="text-slate-700 hover:text-blue-600 font-medium truncate" title="' + escAttr(f.name) + '">' + displayName + '</a>'
                : '<span class="text-slate-700 font-medium truncate" title="' + escAttr(f.name) + '">' + displayName + (isUnplayableVid ? ' <span class="text-xs text-amber-500 font-normal">(需下载)</span>' : '') + '</span>');
        const actionHtml = f.isDirectory
            ? '<span class="text-xs text-slate-400">目录</span>'
            : ('<div class="flex items-center gap-1">' +
                (canPreview ? '<button onclick="event.stopPropagation();' + (isMedia ? 'pubOpenMediaPreview' : 'pubOpenDocPreview') + '(\'' + encodePath(relPath) + '\')" class="flex items-center gap-1 px-2 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg text-xs font-medium transition-colors" title="预览"><svg class="iconify-icon text-sm"><use href="#eye_outline"/></svg></button>' : '') +
                '<button onclick="downloadPublicFile(\'' + encodePath(relPath) + '\', \'' + escAttr(f.name) + '\')" class="flex items-center gap-1 px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-medium transition-colors"><svg class="iconify-icon text-sm"><use href="#download"/></svg>下载</button>' +
                '</div>');
        const sizeHtml = f.isDirectory ? '' : '<span class="text-xs text-slate-400 shrink-0">' + formatFileSize(f.size) + '</span>';
        const rowStyle = (_sortMode === 'category' && currentCatCollapsed) ? ' style="display:none"' : '';
        const rowCatAttr = _sortMode === 'category' ? ' data-cat="' + lastCategory + '"' : '';

        html += catHeader + '<div class="file-row flex items-center gap-3 px-4 py-3 transition-colors"' + rowCatAttr + rowStyle + '>' +
            '<div class="shrink-0">' + icon + '</div>' +
            '<div class="flex-1 min-w-0">' + nameHtml + '</div>' +
            '<div class="shrink-0">' + sizeHtml + '</div>' +
            '<div class="shrink-0">' + actionHtml + '</div>' +
            '</div>';
    });
    list.innerHTML = html;
}

function encodePath(p) {
    return (p || '').replace(/\\/g, '/');
}

function formatFileSize(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let len = bytes;
    while (len >= 1024 && i < sizes.length - 1) { i++; len /= 1024; }
    return len.toFixed(i === 0 ? 0 : 1) + ' ' + sizes[i];
}

function escHtml(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ========== 公共页下载管理（支持断点续传） ==========
const PUB_DL_STATE_KEY = 'lanfs_pub_dl_states';
let _pubDlAbortController = null;
let _pubDlCurrentPath = '';
let _pubDlChunks = [];
let _pubDlReceivedBytes = 0;
let _pubDlTotalBytes = 0;
let _pubDlLastBytes = 0;
let _pubDlLastTime = 0;

function getPubDlStates() {
    try { return JSON.parse(localStorage.getItem(PUB_DL_STATE_KEY) || '{}'); } catch (_) { return {}; }
}

function savePubDlState(path, state) {
    const states = getPubDlStates();
    if (state === null) { delete states[path]; } else { states[path] = state; }
    localStorage.setItem(PUB_DL_STATE_KEY, JSON.stringify(states));
}

function showPubDownloadPanel(fileName) {
    document.getElementById('download-panel').classList.remove('hidden');
    document.getElementById('pub-dl-file').innerText = fileName;
    document.getElementById('pub-dl-percent').innerText = '0%';
    document.getElementById('pub-dl-bar').style.width = '0%';
    document.getElementById('pub-dl-size').innerText = '0 / ...';
    document.getElementById('pub-btn-dl-resume').style.display = 'none';
    document.getElementById('pub-btn-dl-cancel').style.display = '';
}

function hidePubDownloadPanel() {
    document.getElementById('download-panel').classList.add('hidden');
}

function updatePubDlProgress(received, total) {
    if (total > 0) {
        const pct = Math.round(received / total * 100);
        document.getElementById('pub-dl-percent').innerText = pct + '%';
        document.getElementById('pub-dl-bar').style.width = pct + '%';
    }
    document.getElementById('pub-dl-size').innerText = formatFileSize(received) + ' / ' + (total > 0 ? formatFileSize(total) : '...');
    const now = Date.now();
    const elapsed = (now - _pubDlLastTime) / 1000;
    if (elapsed >= 0.5 && _pubDlLastTime > 0) {
        const speed = (received - _pubDlLastBytes) / elapsed;
        // show speed in size text
        const speedText = speed < 1024 ? (speed.toFixed(1) + ' B/s') :
            speed < 1024 * 1024 ? ((speed / 1024).toFixed(1) + ' KB/s') :
            ((speed / (1024 * 1024)).toFixed(1) + ' MB/s');
        _pubDlLastBytes = received;
        _pubDlLastTime = now;
    }
}

function pubCancelDownload() {
    if (_pubDlAbortController) { logAction('取消下载', _pubDlCurrentPath); _pubDlAbortController.abort(); }
}

function pubResumeDownload() {
    if (_pubDlCurrentPath) {
        logAction('继续下载', _pubDlCurrentPath);
        if (_pubDlAbortController) _pubDlAbortController.abort();
        downloadPublicFile(_pubDlCurrentPath, _pubDlCurrentPath.split('/').pop());
    }
}

async function downloadPublicFile(path, fileName) {
    logAction('下载公共共享文件', fileName);
    const url = '/api/public/files/download?path=' + encodeURIComponent(path);

    if (_pubDlAbortController) {
        if (!confirm('已有下载任务进行中，是否取消并开始新下载？')) return;
        pubCancelDownload();
    }

    _pubDlAbortController = new AbortController();
    _pubDlCurrentPath = path;
    _pubDlChunks = [];
    _pubDlReceivedBytes = 0;
    _pubDlTotalBytes = 0;
    _pubDlLastBytes = 0;
    _pubDlLastTime = Date.now();

    showPubDownloadPanel(fileName);

    // 检查断点续传状态
    const savedStates = getPubDlStates();
    const savedState = savedStates[path];
    let resumeFrom = 0;
    if (savedState && savedState.received > 0 && savedState.total > 0 && savedState.received < savedState.total) {
        resumeFrom = savedState.received;
    }

    try {
        // 获取文件大小
        let total = 0;
        try {
            const headResp = await fetch(url, { method: 'HEAD', signal: _pubDlAbortController.signal });
            total = parseInt(headResp.headers.get('Content-Length') || '0');
        } catch (_) {}

        _pubDlTotalBytes = total;

        const fetchHeaders = {};
        if (resumeFrom > 0 && total > 0) {
            fetchHeaders['Range'] = 'bytes=' + resumeFrom + '-';
        }

        const resp = await fetch(url, {
            headers: fetchHeaders,
            signal: _pubDlAbortController.signal
        });

        if (!resp.ok && resp.status !== 206) {
            throw new Error('下载失败: HTTP ' + resp.status);
        }

        if (resp.status === 206) {
            const cr = resp.headers.get('Content-Range');
            if (cr) { const m = cr.match(/bytes \d+-\d+\/(\d+)/); if (m) total = parseInt(m[1]); _pubDlTotalBytes = total; }
        }
        if (total === 0 && resp.headers.get('Content-Length')) {
            total = parseInt(resp.headers.get('Content-Length') || '0');
            _pubDlTotalBytes = total;
        }

        _pubDlReceivedBytes = resumeFrom;
        updatePubDlProgress(_pubDlReceivedBytes, total);

        const reader = resp.body.getReader();
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            _pubDlChunks.push(value);
            _pubDlReceivedBytes += value.length;
            updatePubDlProgress(_pubDlReceivedBytes, total || _pubDlReceivedBytes);

            savePubDlState(path, {
                received: _pubDlReceivedBytes,
                total: total || _pubDlReceivedBytes,
                fileName: fileName,
                time: Date.now()
            });
        }

        const mimeType = resp.headers.get('Content-Type') || 'application/octet-stream';
        const blob = new Blob(_pubDlChunks, { type: mimeType });
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

        savePubDlState(path, null);
        document.getElementById('pub-dl-size').innerText = '✅ 下载完成';
        logAction('下载完成', fileName);
        setTimeout(hidePubDownloadPanel, 2000);

    } catch (err) {
        if (err.name === 'AbortError') {
            if (_pubDlReceivedBytes > 0) {
                savePubDlState(path, {
                    received: _pubDlReceivedBytes,
                    total: _pubDlTotalBytes || _pubDlReceivedBytes,
                    fileName: fileName,
                    time: Date.now()
                });
                document.getElementById('pub-dl-size').innerText = '⏸ 已暂停 (' + formatFileSize(_pubDlReceivedBytes) + ')';
                document.getElementById('pub-btn-dl-resume').style.display = '';
                document.getElementById('pub-btn-dl-cancel').style.display = 'none';
            } else {
                savePubDlState(path, null);
                hidePubDownloadPanel();
            }
        } else {
            if (_pubDlReceivedBytes > 0) {
                savePubDlState(path, {
                    received: _pubDlReceivedBytes,
                    total: _pubDlTotalBytes || _pubDlReceivedBytes,
                    fileName: fileName,
                    time: Date.now()
                });
                document.getElementById('pub-dl-size').innerText = '⚠ 已中断 (' + formatFileSize(_pubDlReceivedBytes) + ')';
                document.getElementById('pub-btn-dl-resume').style.display = '';
                document.getElementById('pub-btn-dl-cancel').style.display = 'none';
            } else {
                savePubDlState(path, null);
                hidePubDownloadPanel();
            }
        }
    } finally {
        _pubDlAbortController = null;
    }
}

let _pubUpAbortController = null;
let _pubCurrentUploadId = null;
let _pubUploadStartTime = 0;
let _pubUploadLastBytes = 0;
let _pubUploadLastTime = 0;
let _pubPendingFiles = null;   // { files: File[], isFolder: boolean }

async function uploadFilesChunked(files, targetPath, isFolder) {
    const statusEl = document.getElementById('upload-status');
    const progressEl = document.getElementById('upload-progress');
    const barEl = document.getElementById('upload-bar');
    const speedEl = document.getElementById('upload-speed');
    const stopBtn = document.getElementById('pub-btn-stop');
    const uploadBtn = document.getElementById('pub-btn-upload');

    // 构建文件列表（文件夹上传时保持相对路径）
    let fileList = [];
    if (isFolder && files.length > 0) {
        const firstPath = files[0].webkitRelativePath || '';
        const folderName = firstPath.split('/')[0] || '';
        const basePath = targetPath ? targetPath + '/' + folderName : folderName;
        for (const f of files) {
            const relPath = f.webkitRelativePath.substring(folderName.length + 1);
            fileList.push({ file: f, fileName: relPath, subPath: basePath });
        }
    } else {
        for (const f of files) {
            fileList.push({ file: f, fileName: f.name, subPath: targetPath || '' });
        }
    }

    const totalSize = fileList.reduce((s, x) => s + x.file.size, 0);
    statusEl.textContent = `上传中... 0/${fileList.length}`;
    statusEl.classList.remove('hidden');
    statusEl.classList.remove('text-red-500');
    progressEl.classList.remove('hidden');
    barEl.style.width = '0%';
    speedEl.textContent = '';
    uploadBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');

    _pubUpAbortController = new AbortController();
    _pubUploadStartTime = Date.now();
    _pubUploadLastBytes = 0;
    _pubUploadLastTime = _pubUploadStartTime;
    let totalUploaded = 0;
    const uploadedList = [];

    for (let fi = 0; fi < fileList.length; fi++) {
        const { file, fileName, subPath } = fileList[fi];

        try {
            statusEl.textContent = '正在校验文件：' + fileName;
            const contentHash = await fingerprintUploadFile(file, _pubUpAbortController.signal);
            // 1. 初始化上传会话
            const initResp = await fetch('/api/public/chunked/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: _pubUpAbortController.signal,
                body: JSON.stringify({ fileName, fileSize: file.size, subPath, contentHash })
            });
            if (!initResp.ok) {
                const errText = await initResp.text();
                throw new Error(errText || '初始化失败');
            }
            const initData = await initResp.json();
            const { uploadId, chunkSize, uploadedBytes, fileExists } = initData;
            _pubCurrentUploadId = uploadId;

            // 检查是否同名文件已存在，需要用户确认是否覆盖
            if (fileExists) {
                const confirmOverride = await new Promise(resolve => {
                    const confirmed = window.confirm('文件 "' + fileName + '" 已存在，确定要覆盖吗？');
                    resolve(confirmed);
                });
                if (!confirmOverride) {
                    showPubToast('已跳过文件: ' + fileName);
                    await fetch('/api/public/chunked/cancel?uploadId=' + encodeURIComponent(uploadId), { method: 'DELETE' });
                    continue;
                }
            }

            // 2. 分块上传（支持断点续传）
            let offset = uploadedBytes || 0;
            totalUploaded += offset;

            while (offset < file.size) {
                const end = Math.min(offset + chunkSize, file.size);
                const blob = file.slice(offset, end);
                const writeResp = await fetch('/api/public/chunked/write?uploadId=' + encodeURIComponent(uploadId) + '&offset=' + offset, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    signal: _pubUpAbortController.signal,
                    body: blob
                });
                if (!writeResp.ok) {
                    const errText = await writeResp.text();
                    throw new Error(errText || '写入分块失败');
                }
                const writeData = await writeResp.json();
                const newUploaded = writeData.uploadedBytes || end;
                const chunkBytes = newUploaded - offset;
                offset = newUploaded;
                totalUploaded += chunkBytes;

                // 更新进度
                const pct = totalSize > 0 ? Math.round(totalUploaded / totalSize * 100) : 0;
                barEl.style.width = pct + '%';
                const completedFiles = uploadedList.length + (offset >= file.size ? 1 : 0);
                statusEl.textContent = `上传中... ${completedFiles}/${fileList.length} (${pct}%)`;

                const now = Date.now();
                const elapsed = (now - _pubUploadLastTime) / 1000;
                if (elapsed >= 0.5 && _pubUploadLastTime > 0) {
                    const speed = (totalUploaded - _pubUploadLastBytes) / elapsed;
                    speedEl.textContent = formatPubSpeed(speed) + ' · ' + formatFileSize(totalUploaded) + ' / ' + formatFileSize(totalSize);
                    _pubUploadLastBytes = totalUploaded;
                    _pubUploadLastTime = now;
                }
            }

            // 3. 完成上传
            const compResp = await fetch('/api/public/chunked/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: _pubUpAbortController.signal,
                body: JSON.stringify({ uploadId, overwrite: fileExists })
            });
            if (!compResp.ok) {
                const errText = await compResp.text();
                throw new Error(errText || '完成上传失败');
            }
            uploadedList.push(fileName);
        } catch (e) {
            if (e.name === 'AbortError') {
                // 取消时清理会话
                if (_pubCurrentUploadId) {
                    try {
                        await fetch('/api/public/chunked/cancel?uploadId=' + encodeURIComponent(_pubCurrentUploadId), { method: 'DELETE' });
                    } catch (_) {}
                }
                statusEl.textContent = '上传已停止';
                stopBtn.classList.add('hidden');
                uploadBtn.classList.add('hidden');
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    progressEl.classList.add('hidden');
                    speedEl.textContent = '';
                }, 2000);
                _pubUpAbortController = null;
                return;
            }
            showUploadError('上传失败: ' + e.message);
            logAction('上传失败', e.message);
            stopBtn.classList.add('hidden');
            uploadBtn.classList.add('hidden');
            _pubUpAbortController = null;
            return;
        }
    }

    statusEl.textContent = `上传完成 ${uploadedList.length}/${fileList.length} 个文件`;
    logAction('上传完成', uploadedList.length + '/' + fileList.length + ' 个文件');
    barEl.style.width = '100%';
    speedEl.textContent = '';
    stopBtn.classList.add('hidden');
    uploadBtn.classList.add('hidden');
    setTimeout(() => {
        statusEl.classList.add('hidden');
        progressEl.classList.add('hidden');
    }, 3000);
    loadFiles(_currentPath);

    _pubUpAbortController = null;
}

function formatPubSize(bytes) {
    if (bytes === 0) return '0 B';
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + sizes[i];
}

function formatPubSpeed(bytesPerSec) {
    if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
    if (bytesPerSec < 1048576) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
    if (bytesPerSec < 1073741824) return (bytesPerSec / 1048576).toFixed(1) + ' MB/s';
    return (bytesPerSec / 1073741824).toFixed(2) + ' GB/s';
}

// ========== 媒体预览 ==========

function pubOpenMediaPreview(filePath) {
    if (!filePath) return;
    const clickedFile = _allFiles.find(f => f.path === filePath);
    if (!clickedFile) return;
    // 不可在线播放的视频格式，直接下载（TS 由 hls.js 支持，不在此列）
    if (isUnplayableVideo(clickedFile.name)) {
        logAction('下载不可播放视频', clickedFile.name);
        downloadPublicFile(filePath, clickedFile.name);
        return;
    }
    if (isImageFile(clickedFile.name)) {
        // 图片：只收集图片，导航时不会遇到视频/音频
        _pubMediaFiles = _allFiles.filter(f => !f.isDirectory && isImageFile(f.name));
    } else if (isPlayableAudio(clickedFile.name)) {
        // 音频：收集所有可播放音频，支持导航切换
        _pubMediaFiles = _allFiles.filter(f => !f.isDirectory && isPlayableAudio(f.name));
    } else {
        // 视频：只收集当前视频，单独播放
        _pubMediaFiles = [clickedFile];
    }
    _pubMediaIndex = _pubMediaFiles.findIndex(f => f.path === filePath);
    if (_pubMediaIndex < 0) return;
    pubShowMediaAt(_pubMediaIndex);
}

function pubShowMediaAt(index) {
    if (index < 0 || index >= _pubMediaFiles.length) return;
    _pubMediaIndex = index;
    const f = _pubMediaFiles[index];
    const url = '/api/public/files/preview?path=' + encodeURIComponent(f.path);
    // 根据媒体数量控制导航按钮
    const hasMultiple = _pubMediaFiles.length > 1;
    document.getElementById('pub-image-prev-btn').style.display = hasMultiple ? 'flex' : 'none';
    document.getElementById('pub-image-next-btn').style.display = hasMultiple ? 'flex' : 'none';
    if (isPlayableVideo(f.name)) {
        // 关闭图片查看器，打开视频
        pubEndImageDrag();
        pubEndPanelDrag();
        _pubImageRotation = 0; _pubImageScale = 1; _pubImageTranslateX = 0; _pubImageTranslateY = 0;
        document.getElementById('pub-modal-image-viewer').classList.add('hidden');
        document.getElementById('pub-image-viewer-img').src = '';
        document.getElementById('pub-image-viewer-img').style.transform = '';
        document.getElementById('pub-video-player-title').innerText = f.name;
        const video = document.getElementById('pub-video-player-el');
        video.src = '';
        video.removeAttribute('src');
        video.src = url;
        video.load();
        // 视频模式：恢复面板宽度
        document.getElementById('pub-video-player-panel').style.maxWidth = '45vw';
        document.getElementById('pub-video-player-el').style.maxHeight = '38vh';
        document.getElementById('pub-video-player-el').style.width = '';
        document.getElementById('pub-video-player-el').style.height = '';
        // 键盘事件：上下键调音量，左右键快进快退
        video.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); }
            if (e.key === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 5); }
            if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); pubAdjustVideoVolume(video, 0.05); }
            if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); pubAdjustVideoVolume(video, -0.05); }
        }, true);
        document.getElementById('pub-modal-video-player').classList.remove('hidden');
        // 初始化音量显示
        pubUpdateVolumeLabel(video);
        document.body.style.overflow = 'hidden';
        logAction('播放视频', f.name);
    } else if (isPlayableAudio(f.name)) {
        // 音频：使用底部固定栏播放器
        pubEndImageDrag();
        pubEndPanelDrag();
        _pubImageRotation = 0; _pubImageScale = 1; _pubImageTranslateX = 0; _pubImageTranslateY = 0;
        document.getElementById('pub-modal-image-viewer').classList.add('hidden');
        document.getElementById('pub-image-viewer-img').src = '';
        document.getElementById('pub-image-viewer-img').style.transform = '';
        document.getElementById('pub-modal-video-player').classList.add('hidden');
        // 使用独立音频播放器
        pubOpenAudioPlayer(f, url);
        logAction('播放音频', f.name);
    } else {
        // 重置所有状态（包括拖拽标记）
        pubEndImageDrag();
        pubEndPanelDrag();
        _pubImageRotation = 0;
        _pubImageScale = 1;
        _pubImageTranslateX = 0;
        _pubImageTranslateY = 0;
        // 递增版本号，使之前的 onload 回调失效
        _pubImageLoadVersion++;
        document.getElementById('pub-image-viewer-title').innerText = f.name;
        const img = document.getElementById('pub-image-viewer-img');
        img.style.transform = '';
        img.style.cursor = 'grab';
        document.getElementById('pub-image-zoom-label').innerText = '100%';
        document.getElementById('pub-modal-image-viewer').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        pubAutoFitImage(img, url, _pubImageLoadVersion);
        logAction('查看图片', f.name);
    }
}

// 图片加载版本号（防止旧 onload 覆盖用户缩放）
let _pubImageLoadVersion = 0;

// 图片自动适配到合适的显示大小
function pubAutoFitImage(img, url, loadVersion) {
    img.style.transform = 'scale(0.01)';
    img.src = url;
    const onDone = () => {
        // 版本不匹配说明用户已切换到其他图片或已手动缩放，不覆盖
        if (loadVersion !== _pubImageLoadVersion) return;
        if (!img.naturalWidth || !img.naturalHeight) return;
        const container = document.getElementById('pub-image-viewer-container');
        const cw = Math.max(container.clientWidth - 32, 100);
        const ch = Math.max(container.clientHeight - 32, 100);
        const fitScale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight, 1);
        _pubImageScale = Math.round(fitScale * 100) / 100;
        _pubImageTranslateX = 0;
        _pubImageTranslateY = 0;
        pubApplyImageTransform();
        img.style.cursor = 'grab';
    };
    if (img.complete && img.naturalWidth) {
        onDone();
    } else {
        img.onload = onDone;
    }
}

function pubApplyImageTransform() {
    const img = document.getElementById('pub-image-viewer-img');
    const t = 'translate(' + _pubImageTranslateX + 'px, ' + _pubImageTranslateY + 'px) rotate(' + _pubImageRotation + 'deg) scale(' + _pubImageScale + ')';
    img.style.transform = t;
    document.getElementById('pub-image-zoom-label').innerText = Math.round(_pubImageScale * 100) + '%';
}

function pubRotateImage(deg) {
    _pubImageRotation = ((_pubImageRotation + deg) % 360 + 360) % 360;
    pubApplyImageTransform();
    logAction('旋转图片', _pubImageRotation + '°');
}

function pubZoomImage(delta) {
    _pubImageScale = Math.max(0.1, Math.min(5, _pubImageScale + delta));
    pubApplyImageTransform();
    const img = document.getElementById('pub-image-viewer-img');
    img.style.cursor = 'grab';
}

function pubResetImageTransform() {
    pubEndImageDrag();
    const img = document.getElementById('pub-image-viewer-img');
    _pubImageRotation = 0;
    _pubImageTranslateX = 0;
    _pubImageTranslateY = 0;
    _pubImageScale = 1;
    img.style.transform = '';
    img.style.cursor = 'grab';
    document.getElementById('pub-image-zoom-label').innerText = '100%';
    _pubImageLoadVersion++;
    pubAutoFitImage(img, img.src, _pubImageLoadVersion);
}

// 结束图片拖拽（公共函数）
function pubEndImageDrag() {
    if (!_pubIsDragging) return;
    _pubIsDragging = false;
    const img = document.getElementById('pub-image-viewer-img');
    img.style.cursor = 'grab';
    img.style.transition = 'transform 0.15s ease';

// 鼠标拖拽移动图片
(function() {
    const img = document.getElementById('pub-image-viewer-img');
    img.addEventListener('mousedown', function(e) {
        // 如果面板正在拖拽，不处理图片拖拽
        if (_pubPanelDragging) return;
        e.preventDefault();
        _pubIsDragging = true;
        _pubDragStartX = e.clientX;
        _pubDragStartY = e.clientY;
        _pubDragOrigTranslateX = _pubImageTranslateX;
        _pubDragOrigTranslateY = _pubImageTranslateY;
        img.style.cursor = 'grabbing';

    });

        _pubImageTranslateX = _pubDragOrigTranslateX + dx;
        _pubImageTranslateY = _pubDragOrigTranslateY + dy;
        const t = 'translate(' + _pubImageTranslateX + 'px, ' + _pubImageTranslateY + 'px) rotate(' + _pubImageRotation + 'deg) scale(' + _pubImageScale + ')';
        document.getElementById('pub-image-viewer-img').style.transform = t;

document.getElementById('pub-image-viewer-container').addEventListener('wheel', function(e) {

// ========== 面板拖拽（视频播放器和图片查看器） ==========
let _pubPanelDragging = false;
let _pubPanelElement = null;
let _pubPanelDragSX = 0, _pubPanelDragSY = 0;
let _pubPanelDragTX = 0, _pubPanelDragTY = 0;
let _pubPanelDragPW = 0, _pubPanelDragPH = 0;  // 拖拽开始时面板的宽高

function pubEndPanelDrag() {
    if (!_pubPanelDragging) return;
    var style = _pubPanelElement.style.transform || '';
    var m = style.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
    if (m) {
        _pubPanelElement.setAttribute('data-tx', m[1]);
        _pubPanelElement.setAttribute('data-ty', m[2]);
    }
    _pubPanelDragging = false;
    _pubPanelElement = null;
    document.body.style.userSelect = '';
}

window.addEventListener('mousedown', function(e) {
    if (_pubIsDragging) return;
    if (_pubPanelDragging) return;
    var handle = e.target.closest('.panel-drag-handle');
    if (!handle) return;
    if (e.target.closest('button')) return;
    var panel = handle.closest('[data-panel]');
    if (!panel) return;
    e.preventDefault();
    _pubPanelDragging = true;
    _pubPanelElement = panel;
    _pubPanelDragSX = e.clientX;
    _pubPanelDragSY = e.clientY;
    _pubPanelDragTX = parseFloat(panel.getAttribute('data-tx') || '0');
    _pubPanelDragTY = parseFloat(panel.getAttribute('data-ty') || '0');
    // 保存拖拽开始时面板的布局尺寸（不受 transform 影响）
    var rect = panel.getBoundingClientRect();
    _pubPanelDragPW = rect.width;
    _pubPanelDragPH = rect.height;
    document.body.style.userSelect = 'none';
});

window.addEventListener('mousemove', function(e) {
    if (!_pubPanelDragging) return;
    var tx = _pubPanelDragTX + (e.clientX - _pubPanelDragSX);
    var ty = _pubPanelDragTY + (e.clientY - _pubPanelDragSY);
    _pubPanelElement.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
});

// 使用 window 级别监听，确保鼠标移出浏览器窗口时也能结束拖拽
window.addEventListener('mouseup', pubEndPanelDrag);
window.addEventListener('blur', pubEndPanelDrag);

// ========== 文档预览（PDF/Word/Excel/文本） ==========
var _pubDocPreviewType = '';
var _pubDocPreviewPath = '';
var _pubPdfDoc = null;
var _pubPdfPageNum = 0;
var _pubPdfTotalPages = 0;
var _pubExcelWb = null; // SheetJS workbook 引用
var _pubExcelActiveSheet = 0;

function pubOpenDocPreview(filePath) {
    if (!filePath) return;
    var clickedFile = _allFiles.find(f => f.path === filePath);
    if (!clickedFile) return;
    if (clickedFile.size > 50 * 1024 * 1024) {
        showToast('文件过大（>50MB），不支持预览');
        return;
    }
    var rawUrl = '/api/public/files/preview/raw?path=' + encodeURIComponent(filePath);
    var downloadUrl = '/api/public/files/preview?path=' + encodeURIComponent(filePath);

    _pubDocPreviewPath = filePath;
    _pubPdfDoc = null; _pubPdfPageNum = 0; _pubPdfTotalPages = 0;
    document.getElementById('pub-doc-preview-pdf').classList.add('hidden');
    document.getElementById('pub-doc-preview-word').classList.add('hidden');
    document.getElementById('pub-doc-preview-excel').classList.add('hidden');
    document.getElementById('pub-doc-preview-text').classList.add('hidden');
    document.getElementById('pub-doc-preview-unsupported').classList.add('hidden');
    var pubLoadingEl = document.getElementById('pub-doc-preview-loading');
    pubLoadingEl.classList.remove('hidden');
    pubLoadingEl.querySelector('span').textContent = '加载中...';
    document.getElementById('pub-doc-prev-btn').classList.add('hidden');
    document.getElementById('pub-doc-next-btn').classList.add('hidden');
    document.getElementById('pub-doc-viewer-pages').classList.add('hidden');
    document.getElementById('pub-doc-viewer-title').textContent = clickedFile.name;
    document.getElementById('pub-modal-doc-viewer').classList.remove('hidden');

    var name = clickedFile.name;
    if (isPdfFile(name)) {
        _pubDocPreviewType = 'pdf';
        pubLoadPdfPreview(rawUrl);
    } else if (isWordFile(name)) {
        _pubDocPreviewType = 'word';
        pubLoadWordPreview(rawUrl);
    } else if (isExcelFile(name)) {
        _pubDocPreviewType = 'excel';
        pubLoadExcelPreview(rawUrl);
    } else if (isTextFile(name)) {
        _pubDocPreviewType = 'text';
        pubLoadTextPreview(rawUrl);
    } else {
        _pubDocPreviewType = '';
        pubShowDocUnsupported();
    }
}

function pubLoadPdfPreview(url) {
    document.getElementById('pub-doc-preview-loading').classList.remove('hidden');
    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'CDN/pdf.worker.min.js';
        // 先用 fetch 获取完整的 PDF 数据，再用 data 参数传给 PDF.js
        // credentials: 'same-origin' 确保携带 session cookie
        fetch(url, { credentials: 'same-origin' }).then(function(r) {
            if (!r.ok) return r.text().then(function(t) { throw new Error(t || 'HTTP ' + r.status); });
            return r.arrayBuffer();
        }).then(function(data) {
            if (!data || data.byteLength === 0) throw new Error('文件内容为空');
            var loadingTask = pdfjsLib.getDocument({ data: data });
            loadingTask.promise.then(function(pdf) {
                _pubPdfDoc = pdf;
                _pubPdfTotalPages = pdf.numPages;
                document.getElementById('pub-doc-preview-loading').classList.add('hidden');
                document.getElementById('pub-doc-preview-pdf').classList.remove('hidden');
                if (_pubPdfTotalPages > 1) {
                    document.getElementById('pub-doc-prev-btn').classList.remove('hidden');
                    document.getElementById('pub-doc-next-btn').classList.remove('hidden');
                    document.getElementById('pub-doc-viewer-pages').classList.remove('hidden');
                }
                _pubPdfPageNum = 1;
                pubRenderPdfPage(_pubPdfPageNum);
            }).catch(function(err) { pubShowDocUnsupported(err && err.message ? err.message : ''); });
        }).catch(function(err) { pubShowDocUnsupported(err && err.message ? err.message : ''); });
    } else { pubShowDocUnsupported(); }
}

function pubRenderPdfPage(num) {
    if (!_pubPdfDoc) return;
    _pubPdfDoc.getPage(num).then(function(page) {
        var viewport = page.getViewport({ scale: 1.5 });
        var canvas = document.getElementById('pub-doc-pdf-canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        page.render({ canvasContext: ctx, viewport: viewport });
        document.getElementById('pub-doc-viewer-pages').textContent = num + ' / ' + _pubPdfTotalPages;
        document.getElementById('pub-doc-prev-btn').style.visibility = num <= 1 ? 'hidden' : 'visible';
        document.getElementById('pub-doc-next-btn').style.visibility = num >= _pubPdfTotalPages ? 'hidden' : 'visible';
    });
}

function pubDocPrevPage() {
    if (_pubPdfDoc && _pubPdfPageNum > 1) { _pubPdfPageNum--; pubRenderPdfPage(_pubPdfPageNum); }
}
function pubDocNextPage() {
    if (_pubPdfDoc && _pubPdfPageNum < _pubPdfTotalPages) { _pubPdfPageNum++; pubRenderPdfPage(_pubPdfPageNum); }
}

function pubLoadWordPreview(url) {
    if (typeof mammoth === 'undefined') {
        var loadingEl = document.getElementById('pub-doc-preview-loading');
        if (loadingEl) {
            loadingEl.querySelector('span').textContent = '解析库正在加载...';
            loadingEl.classList.remove('hidden');
        }
        setTimeout(function() { pubLoadWordPreview(url); }, 500);
        return;
    }
    fetch(url, { credentials: 'same-origin' }).then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t || '加载失败'); }); return r.arrayBuffer(); })
    .then(function(buf) { return mammoth.convertToHtml({ arrayBuffer: buf }); })
    .then(function(result) {
        document.getElementById('pub-doc-preview-loading').classList.add('hidden');
        document.getElementById('pub-doc-preview-word').classList.remove('hidden');
        document.getElementById('pub-doc-preview-container').innerHTML = result.value;
    }).catch(function(err) { pubShowDocUnsupported(err && err.message ? err.message : ''); });
}

function pubLoadExcelPreview(url) {
    if (typeof XLSX === 'undefined') {
        var loadingEl = document.getElementById('pub-doc-preview-loading');
        if (loadingEl) {
            loadingEl.querySelector('span').textContent = '解析库正在加载...';
            loadingEl.classList.remove('hidden');
        }
        setTimeout(function() { pubLoadExcelPreview(url); }, 500);
        return;
    }
    fetch(url, { credentials: 'same-origin' }).then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t || '加载失败'); }); return r.arrayBuffer(); })
    .then(function(buf) {
        if (!buf || buf.byteLength === 0) throw new Error('文件内容为空');
        var data = new Uint8Array(buf);
        var wb;
        try {
            wb = XLSX.read(data, { type: 'array' });
        } catch(e1) {
            try {
                // 降级：分块转换 Uint8Array 为 binary string（兼容老 BIFF .xls）
                var bstr = '';
                var CHUNK = 4096;
                for (var i = 0; i < data.length; i += CHUNK) {
                    bstr += String.fromCharCode.apply(null, data.subarray(i, i + CHUNK));
                }
                wb = XLSX.read(bstr, { type: 'binary' });
            } catch(e2) {
                throw e1;
            }
        }
        // 存储 workbook 引用，支持 Sheet 切换
        _pubExcelWb = wb;
        _pubExcelActiveSheet = 0;
        pubRenderExcelSheet(0);
    }).catch(function(err) { pubShowDocUnsupported(err && err.message ? err.message : ''); });
}

function pubRenderExcelSheet(idx) {
    if (!_pubExcelWb || idx < 0 || idx >= _pubExcelWb.SheetNames.length) return;
    _pubExcelActiveSheet = idx;
    var sheetName = _pubExcelWb.SheetNames[idx];
    var html = XLSX.utils.sheet_to_html(_pubExcelWb.Sheets[sheetName], { editable: false });
    document.getElementById('pub-doc-preview-loading').classList.add('hidden');
    document.getElementById('pub-doc-preview-excel').classList.remove('hidden');
    document.getElementById('pub-doc-preview-excel-wrap').innerHTML = html;
    // 渲染 Sheet 标签页
    var tabsHtml = '';
    for (var i = 0; i < _pubExcelWb.SheetNames.length; i++) {
        tabsHtml += '<button class="excel-sheet-tab' + (i === idx ? ' active' : '') +
            '" onclick="pubRenderExcelSheet(' + i + ')">' + escHtml(_pubExcelWb.SheetNames[i]) + '</button>';
    }
    document.getElementById('pub-doc-preview-excel-tabs').innerHTML = tabsHtml;
    document.getElementById('pub-doc-preview-excel-tabs').style.display = _pubExcelWb.SheetNames.length > 1 ? 'flex' : 'none';
}

function pubLoadTextPreview(url) {
    fetch(url, { credentials: 'same-origin' }).then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t || '加载失败'); }); return r.arrayBuffer(); })
    .then(function(buf) {
        var text = '';
        // 检测 BOM 头判断编码
        var arr = new Uint8Array(buf);
        if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) {
            // UTF-8 BOM
            text = new TextDecoder('utf-8').decode(buf.slice(3));
        } else if (arr.length >= 2 && arr[0] === 0xFF && arr[1] === 0xFE) {
            // UTF-16 LE
            text = new TextDecoder('utf-16le').decode(buf.slice(2));
        } else if (arr.length >= 2 && arr[0] === 0xFE && arr[1] === 0xFF) {
            // UTF-16 BE
            text = new TextDecoder('utf-16be').decode(buf.slice(2));
        } else {
            // 无 BOM：先尝试 UTF-8，失败则降级到 GBK
            try {
                text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
            } catch(e) {
                try {
                    text = new TextDecoder('gbk').decode(buf);
                } catch(e2) {
                    text = new TextDecoder('gb2312').decode(buf);
                }
            }
        }
        var maxLen = 500000;
        if (text.length > maxLen) text = text.substring(0, maxLen) + '\n\n... (内容过长，已截断，请下载查看完整文件)';
        document.getElementById('pub-doc-preview-loading').classList.add('hidden');
        document.getElementById('pub-doc-preview-text').classList.remove('hidden');
        document.getElementById('pub-doc-preview-text').textContent = text;
    }).catch(function(err) { pubShowDocUnsupported(err && err.message ? err.message : ''); });
}

var _pubAudioPlaylist = [];
var _pubAudioPlayIndex = -1;
var _pubAudioWaveAnimId = null;

function _pubInitAudioWaveCanvas() {
    var canvas = document.getElementById('pub-audio-wave-canvas');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return { canvas: canvas, ctx: ctx, w: rect.width, h: rect.height };
}

function _pubDrawAudioWave(progress, playing) {
    var c = _pubInitAudioWaveCanvas();
    var ctx = c.ctx, w = c.w, h = c.h;
    ctx.clearRect(0, 0, w, h);

    var barCount = 128;
    var barWidth = (w / barCount) * 0.5;
    var gap = (w / barCount) * 0.5;
    var centerY = h / 2;
    var playedBars = Math.floor(progress * barCount);

    function pseudoRandom(seed) {
        var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    }

    for (var i = 0; i < barCount; i++) {
        var r = pseudoRandom(i * 0.37 + 5.19);
        var maxH = (h - 6) * (0.3 + r * 0.7);
        var x = i * (barWidth + gap) + gap / 2;

        if (i < playedBars) {
            var alpha = 0.7 + (i / playedBars) * 0.3;
            ctx.fillStyle = 'rgba(59, 130, 246, ' + alpha + ')';
        } else {
            ctx.fillStyle = 'rgba(107, 114, 128, 0.45)';
        }

        var bh = maxH;
        if (playing && i === playedBars) {
            bh = maxH * (1.2 + 0.4 * Math.sin(Date.now() / 150));
        }

        ctx.fillRect(x, centerY - bh / 2, barWidth, bh);
    }

    if (progress > 0) {
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, centerY);
        ctx.lineTo(w * progress, centerY);
        ctx.stroke();
    }
}

function _pubStartAudioWaveAnimation() {
    var audio = document.getElementById('pub-audio-player-el');
    function animate() {
        var progress = audio.duration ? audio.currentTime / audio.duration : 0;
        _pubDrawAudioWave(progress, !audio.paused);
        _pubAudioWaveAnimId = requestAnimationFrame(animate);
    }
    if (_pubAudioWaveAnimId) cancelAnimationFrame(_pubAudioWaveAnimId);
    animate();
}

function _pubStopAudioWaveAnimation() {
    if (_pubAudioWaveAnimId) {
        cancelAnimationFrame(_pubAudioWaveAnimId);
        _pubAudioWaveAnimId = null;
    }
    var audio = document.getElementById('pub-audio-player-el');
    var progress = audio.duration ? audio.currentTime / audio.duration : 0;
    _pubDrawAudioWave(progress, false);
}

function pubOpenAudioPlayer(f, url) {
    _pubAudioPlaylist = _pubMediaFiles;
    _pubAudioPlayIndex = _pubMediaIndex;
    var bar = document.getElementById('pub-audio-player-bar');
    bar.style.display = 'flex';
    document.getElementById('pub-audio-player-title').innerText = f.name;
    _pubCheckAudioTitleMarquee(document.getElementById('pub-audio-player-title'));
    var audio = document.getElementById('pub-audio-player-el');
    audio.src = url;
    audio.load();
    audio.play();
    pubUpdateAudioPlayBtn(true);
    audio.ontimeupdate = function() { pubUpdateAudioTimeDisplay(audio); };
    audio.onloadedmetadata = function() { pubUpdateAudioDuration(audio); };
    audio.onended = function() {
        pubUpdateAudioPlayBtn(false);
        _pubStopAudioWaveAnimation();
        _pubDrawAudioWave(1, false);
    };
    audio.onplay = function() {
        pubUpdateAudioPlayBtn(true);
        _pubStartAudioWaveAnimation();
    };
    audio.onpause = function() {
        pubUpdateAudioPlayBtn(false);
        _pubStopAudioWaveAnimation();
    };
    document.getElementById('pub-audio-volume-bar').value = Math.round(audio.volume * 100);
    document.getElementById('pub-audio-prev-btn').style.display = _pubAudioPlaylist.length > 1 ? '' : 'none';
    document.getElementById('pub-audio-next-btn').style.display = _pubAudioPlaylist.length > 1 ? '' : 'none';
    audio.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
        if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5); }
        if (e.key === 'ArrowUp') { e.preventDefault(); pubSetAudioVolume(Math.round((audio.volume + 0.05) * 100)); }
        if (e.key === 'ArrowDown') { e.preventDefault(); pubSetAudioVolume(Math.round((audio.volume - 0.05) * 100)); }
    }, true);
    var waveCanvas = document.getElementById('pub-audio-wave-canvas');
    waveCanvas.onclick = function(e) {
        var rect = waveCanvas.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / rect.width;
        if (audio.duration) {
            audio.currentTime = ratio * audio.duration;
        }
    };
    _pubDrawAudioWave(0, false);
}

function pubToggleAudioPlay() {
    var audio = document.getElementById('pub-audio-player-el');
    if (audio.paused) { audio.play(); } else { audio.pause(); }
}

function pubUpdateAudioPlayBtn(playing) {
    var btn = document.getElementById('pub-audio-play-btn');
    if (playing) {
        btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7z"/></svg>';

}

function pubUpdateAudioTimeDisplay(audio) {
    document.getElementById('pub-audio-current-time').innerText = pubFormatTime(audio.currentTime);
}

function pubUpdateAudioDuration(audio) {
    document.getElementById('pub-audio-duration-time').innerText = pubFormatTime(audio.duration || 0);
}

function pubSetAudioVolume(value) {
    var audio = document.getElementById('pub-audio-player-el');
    audio.volume = value / 100;
    document.getElementById('pub-audio-volume-bar').value = value;
    pubUpdateAudioMuteBtn(audio);
}

function pubToggleAudioMute() {
    var audio = document.getElementById('pub-audio-player-el');
    audio.muted = !audio.muted;
    pubUpdateAudioMuteBtn(audio);
}

    } else {
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.84-5 6.7v2.07c4-.91 7-4.49 7-8.77s-3-7.86-7-8.77M16.5 12c0-1.77-1-3.29-2.5-4.03V16c1.5-.71 2.5-2.24 2.5-4M3 9v6h4l5 5V4L7 9z"/></svg>';
