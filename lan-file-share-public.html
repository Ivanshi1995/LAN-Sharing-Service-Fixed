function pubAudioPlayerPrev() {
    if (_pubAudioPlaylist.length <= 1) return;
    _pubAudioPlayIndex = (_pubAudioPlayIndex - 1 + _pubAudioPlaylist.length) % _pubAudioPlaylist.length;
    _pubMediaIndex = _pubAudioPlayIndex;
    pubAudioPlayerLoadCurrent();
}

function pubAudioPlayerNext() {
    if (_pubAudioPlaylist.length <= 1) return;
    _pubAudioPlayIndex = (_pubAudioPlayIndex + 1) % _pubAudioPlaylist.length;
    _pubMediaIndex = _pubAudioPlayIndex;
    pubAudioPlayerLoadCurrent();
}

function pubAudioPlayerLoadCurrent() {
    if (_pubAudioPlayIndex < 0 || _pubAudioPlayIndex >= _pubAudioPlaylist.length) return;
    var f = _pubAudioPlaylist[_pubAudioPlayIndex];
    var url = '/api/public/files/preview?path=' + encodeURIComponent(f.path);
    document.getElementById('pub-audio-player-title').innerText = f.name;
    _pubCheckAudioTitleMarquee(document.getElementById('pub-audio-player-title'));
    var audio = document.getElementById('pub-audio-player-el');
    audio.src = url;
    audio.load();
    audio.play();
}

function pubCloseAudioPlayer() {
    _pubStopAudioWaveAnimation();
    var audio = document.getElementById('pub-audio-player-el');
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    document.getElementById('pub-audio-player-bar').style.display = 'none';
    _pubAudioPlaylist = [];
    _pubAudioPlayIndex = -1;
}

function _pubCheckAudioTitleMarquee(el) {
    var wrap = el.parentNode;
    el.classList.remove('marquee');
    void el.offsetWidth;
    if (el.scrollWidth > wrap.clientWidth) {
        var clone = wrap.querySelector('.audio-title-clone');
        if (!clone) {
            clone = document.createElement('span');
            clone.className = 'audio-title-inner audio-title-clone';
            wrap.appendChild(clone);
        }
        clone.textContent = el.textContent;
        el.classList.add('marquee');
        clone.classList.add('marquee');
    } else {
        var clone = wrap.querySelector('.audio-title-clone');
        if (clone) clone.remove();
    }
}

function pubFormatTime(seconds) {
    if (!seconds || !isFinite(seconds)) return '00:00';
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// 调整视频音量（delta 为增减量，范围 0~1）
function pubAdjustVideoVolume(video, delta) {
    video.volume = Math.max(0, Math.min(1, video.volume + delta));
    pubUpdateVolumeLabel(video);
}

// 更新音量百分比显示
function pubUpdateVolumeLabel(video) {
    const pct = Math.round(video.volume * 100);
    const icon = video.muted || video.volume === 0 ? '🔇' : (video.volume < 0.5 ? '🔉' : '🔊');
    pubShowVolumeOverlay(icon + ' ' + pct + '%');
}

function pubShowVolumeOverlay(text) {
    const overlay = document.getElementById('pub-video-volume-overlay');
    if (!overlay) return;
    overlay.textContent = text;
    overlay.classList.remove('hidden');
    overlay.style.display = '';
    clearTimeout(overlay._hideTimer);
    overlay._hideTimer = setTimeout(function() { overlay.classList.add('hidden'); }, 1500);
}

// 自定义全屏：直接全屏 panel（包含 header、视频、控制条、overlay）
function pubToggleVideoFullscreen() {
    const panel = document.getElementById('pub-video-player-panel');
    if (!panel) return;
    if (document.fullscreenElement === panel) {
        document.exitFullscreen();
    } else {
        panel.style.maxWidth = '100vw';
        panel.style.maxHeight = '100vh';
        panel.style.borderRadius = '0';
        panel.style.width = '100vw';
        panel.style.height = '100vh';
        panel.requestFullscreen();
    }
}

// 全屏切换后自动聚焦视频
document.addEventListener('fullscreenchange', function() {
    const panel = document.getElementById('pub-video-player-panel');
    const video = document.getElementById('pub-video-player-el');
    if (document.fullscreenElement === panel) {
        if (video) video.style.maxHeight = 'calc(100vh - 40px)';
        if (document.activeElement) document.activeElement.blur();
        setTimeout(function() { if (video) video.focus(); }, 50);
    } else {
        if (panel) {
            panel.style.maxWidth = '';
            panel.style.maxHeight = '';
            panel.style.borderRadius = '';
            panel.style.width = '';
            panel.style.height = '';
        }
        if (video) video.style.maxHeight = '38vh';
    }
});

// 视频播放/暂停
function pubToggleVideoPlay() {
    const video = document.getElementById('pub-video-player-el');
    const btn = document.getElementById('pub-video-play-btn');
    if (!video || !btn) return;
    if (video.paused) {
        video.play();
        btn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#pause"/></svg>';
    } else {
        video.pause();
        btn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#play"/></svg>';
    }
}

// 静音切换
function pubToggleVideoMute() {
    const video = document.getElementById('pub-video-player-el');
    const btn = document.getElementById('pub-video-mute-btn');
    const volBar = document.getElementById('pub-video-volume-bar');
    if (!video || !btn) return;
    video.muted = !video.muted;
    pubUpdateMuteBtn(video, btn, volBar);
}

function pubUpdateMuteBtn(video, btn, volBar) {
    if (!btn) return;
    if (video.muted || video.volume === 0) {
        btn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#volume_off"/></svg>';
    } else if (video.volume < 0.5) {
        btn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#volume_medium"/></svg>';
    } else {
        btn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#volume_high"/></svg>';
    }
    if (volBar) volBar.value = video.muted ? 0 : Math.round(video.volume * 100);
}

// 音量滑块
function pubSetVideoVolume(val) {
    const video = document.getElementById('pub-video-player-el');
    const btn = document.getElementById('pub-video-mute-btn');
    const volBar = document.getElementById('pub-video-volume-bar');
    if (!video) return;
    video.volume = val / 100;
    video.muted = (val == 0);
    pubUpdateMuteBtn(video, btn, volBar);
    pubUpdateVolumeLabel(video);
}

// 视频进度拖动
function pubSeekVideo(val) {
    const video = document.getElementById('pub-video-player-el');
    if (!video || !video.duration) return;
    video.currentTime = (val / 100) * video.duration;
}

// 初始化视频控制条事件
(function initPubVideoControls() {
    const video = document.getElementById('pub-video-player-el');
    const seekBar = document.getElementById('pub-video-seek-bar');
    const timeLabel = document.getElementById('pub-video-time-label');
    const playBtn = document.getElementById('pub-video-play-btn');
    const muteBtn = document.getElementById('pub-video-mute-btn');
    const volBar = document.getElementById('pub-video-volume-bar');
    if (!video) return;
    function fmt(t) {
        if (isNaN(t)) return '00:00';
        const m = Math.floor(t / 60), s = Math.floor(t % 60);
        return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }
    video.addEventListener('timeupdate', function() {
        if (seekBar && video.duration) seekBar.value = (video.currentTime / video.duration) * 100;
        if (timeLabel) timeLabel.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
    });
    video.addEventListener('play', function() {
        if (playBtn) playBtn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#pause"/></svg>';
    });
    video.addEventListener('pause', function() {
        if (playBtn) playBtn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#play"/></svg>';
    });
    video.addEventListener('ended', function() {
        if (playBtn) playBtn.innerHTML = '<svg class="iconify-icon text-xl"><use href="#replay"/></svg>';
    });
    video.addEventListener('volumechange', function() {
        pubUpdateMuteBtn(video, muteBtn, volBar);
        if (volBar) volBar.value = video.muted ? 0 : Math.round(video.volume * 100);
    });
    // 单击：延迟判断，如果短时间内有双击则取消
    var _clickTimer = null;
    video.addEventListener('click', function() {
        if (_clickTimer) {
            clearTimeout(_clickTimer);
            _clickTimer = null;
            return;
        }
        _clickTimer = setTimeout(function() {
            _clickTimer = null;
            pubToggleVideoPlay();
        }, 250);
    });
    // 双击全屏
    video.addEventListener('dblclick', function(e) {
        if (_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; }
        pubToggleVideoFullscreen();
    });
})();

// 键盘导航（使用捕获阶段，确保全屏模式下也能拦截方向键）
document.addEventListener('keydown', function(e) {
    const iv = document.getElementById('pub-modal-image-viewer');
    const vp = document.getElementById('pub-modal-video-player');
    const dv = document.getElementById('pub-modal-doc-viewer');
    if (iv.classList.contains('hidden') && vp.classList.contains('hidden') && dv.classList.contains('hidden')) return;
    if (e.key === 'Escape') { pubCloseImageViewer(); pubCloseVideoPlayer(); pubCloseDocViewer(); return; }
    // 视频播放时：方向键快退/快进/调音量
    if (!vp.classList.contains('hidden')) {
        const video = document.getElementById('pub-video-player-el');
        if (e.key === 'ArrowLeft') { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 5); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); pubAdjustVideoVolume(video, 0.05); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); pubAdjustVideoVolume(video, -0.05); return; }
    }
    // 图片预览时：左右箭头切换图片
    if (!iv.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); pubNavigateMedia(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); pubNavigateMedia(1); }
    }
}, true);

})();
